map $request_uri $sanitized_request_uri {
    ~*^(.*[?&]token=)[^&]+(.*)$  $1[REDACTED_TOKEN]$2;
    default                      $request_uri;
}

log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $sanitized_request_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/access.log sanitized;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://master:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://master:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    }
}